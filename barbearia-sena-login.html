<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Painel Barbearia Sena</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#1c1b1a; --bg-alt:#26241f; --paper:#f5f1e8;
    --gold:#c9a227; --gold-dark:#96771b; --line:rgba(245,241,232,0.14); --muted:rgba(245,241,232,0.6); --red:#dc5c5c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--paper); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .box{
    background:var(--bg-alt); border:1px solid var(--line); border-radius:12px;
    padding:44px 38px; width:100%; max-width:380px;
  }
  h1{font-family:'Playfair Display',serif; font-size:1.6rem; margin-bottom:6px; text-align:center;}
  .sub{color:var(--muted); font-size:0.88rem; text-align:center; margin-bottom:32px;}
  label{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600; display:block; margin-bottom:8px;}
  .field{margin-bottom:18px;}
  input{
    width:100%; font-family:inherit; font-size:0.95rem; padding:12px 14px;
    background:var(--bg); color:var(--paper); border:1px solid var(--line); border-radius:4px;
  }
  input:focus{outline:none; border-color:var(--gold);}
  button{
    width:100%; background:var(--gold); color:var(--bg); padding:14px; font-weight:700;
    border:none; border-radius:4px; font-size:0.92rem; cursor:pointer; margin-top:8px;
  }
  button:hover{background:var(--gold-dark);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .error{color:var(--red); font-size:0.85rem; margin-top:14px; text-align:center; display:none;}
  .error.show{display:block;}
</style>
</head>
<body>

<div class="box">
  <h1>Barbearia Sena</h1>
  <div class="sub">Acesso restrito à equipe</div>

  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" />
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" />
  </div>

  <button id="btnLogin">Entrar</button>
  <div class="error" id="errorMsg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://snbqanugqywoenicfwdg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_mClshIkNSNA6DUcaf64Ewg_kZSJlCkl';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function tentarLogin(){
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('btnLogin');
    errorMsg.classList.remove('show');

    if(!email || !senha){
      errorMsg.textContent = 'Preencha e-mail e senha.';
      errorMsg.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

    if(error){
      errorMsg.textContent = 'E-mail ou senha incorretos.';
      errorMsg.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'barbearia-sena-painel.html';
  }

  document.getElementById('btnLogin').addEventListener('click', tentarLogin);
  document.getElementById('senha').addEventListener('keypress', e => { if(e.key === 'Enter') tentarLogin(); });

  // Se já estiver logado, pula direto pro painel
  supabaseClient.auth.getSession().then(({ data }) => {
    if(data.session) window.location.href = 'barbearia-sena-painel.html';
  });
</script>

</body>
</html>
